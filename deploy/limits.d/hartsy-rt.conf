# /etc/security/limits.d/hartsy-rt.conf, installed by deploy/install-host-tuning.sh.
# Lets the service user ask for real-time priority up to 50 outside systemd, for a dev run of the phone gateway from a
# login shell. It permits rather than restricts: any process of the user may then use SCHED_FIFO up to 50, and only the
# gateway's RTP tick thread asks for it. Under systemd the gateway unit grants the same limit itself (LimitRTPRIO=50).
# Takes effect at the next login session: `ulimit -r` prints 50. "hartsy" is the units' User=; change both together.
hartsy - rtprio 50
