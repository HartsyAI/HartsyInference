name: CI (CPU)

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-test:
    name: Build + CPU tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET 10 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            10.0.x

      - name: Restore
        run: dotnet restore HartsyInference.sln

      - name: Build (Release)
        run: dotnet build HartsyInference.sln --configuration Release --no-restore

      - name: Run unit tests (no GPU, no checkpoints required)
        shell: bash
        env:
          # The integration tests skip cleanly when a checkpoint path env-var
          # is missing. CI never sets these; only the GPU runner does.
          DOTNET_NOLOGO: '1'
          DOTNET_CLI_TELEMETRY_OPTOUT: '1'
        run: |
          # CI gates on the deterministic "Unit" tier only. Tests are excluded by TRAIT, not by
          # name-substring (the old approach silently missed newly-added heavy tests). Tiers:
          #   Category=Integration     — real-weight parity, env-gated (needs checkpoints)
          #   Category=GpuIntegration  — needs a CUDA device + PTX (only the self-hosted runner)
          #   Category=Slow            — long-running, run on the GPU/nightly lane
          #   Category=SyntheticSmoke  — forward-pass over random weights on validation-pending model
          #                              code; fragile and can hard-crash the host until the model is
          #                              validated. Graduates back to Unit once it has real parity.
          #   Network=Real             — hits the network, run manually.
          # See docs/CODE_STYLE.md ("Test tiers") for the rule new tests must follow.
          dotnet test HartsyInference.sln --configuration Release --no-build \
            --filter "Category!=Integration&Category!=GpuIntegration&Category!=Slow&Category!=SyntheticSmoke&Network!=Real&FullyQualifiedName!~Generation&FullyQualifiedName!~Img2Img&FullyQualifiedName!~Diff&FullyQualifiedName!~Ssim&FullyQualifiedName!~Vulkan&FullyQualifiedName!~Smoke" \
            --logger "console;verbosity=normal"
