name: CI (CPU)

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-test:
    name: Build + CPU tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET 10 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            10.0.x

      - name: Restore
        run: dotnet restore HartsyInference.sln

      - name: Build (Release)
        run: dotnet build HartsyInference.sln --configuration Release --no-restore

      - name: Run unit tests (no GPU, no checkpoints required)
        shell: bash
        env:
          # The integration tests skip cleanly when a checkpoint path env-var
          # is missing. CI never sets these; only the GPU runner does.
          DOTNET_NOLOGO: '1'
          DOTNET_CLI_TELEMETRY_OPTOUT: '1'
        run: |
          dotnet test HartsyInference.sln --configuration Release --no-build \
            --filter "FullyQualifiedName!~Generation&FullyQualifiedName!~Img2Img&FullyQualifiedName!~Diff&FullyQualifiedName!~Ssim&FullyQualifiedName!~Vulkan&FullyQualifiedName!~Smoke" \
            --logger "console;verbosity=normal"
