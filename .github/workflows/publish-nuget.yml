name: Publish to NuGet

# Auto-publishes the HartsyInference packages to NuGet.org on every push to main that
# touches source or packaging. Each run gets a unique prerelease version
# (1.0.0-alpha.<run_number>) so versions never collide; NuGet.org forbids re-pushing
# an existing version. Trigger manually via "Run workflow" to override the suffix.
#
# Auth uses NuGet Trusted Publishing (OIDC), so there is no API key/secret to store. A matching
# Trusted Publisher policy must exist on nuget.org:
#   Owner=kalebbroo  RepositoryOwner=HartsyAI  Repository=HartsyInference  WorkflowFile=publish-nuget.yml

on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'native/**'
      - 'Directory.Build.props'
      - 'Directory.Build.targets'
      - 'Directory.Packages.props'
      - '.github/workflows/publish-nuget.yml'
  workflow_dispatch:
    inputs:
      version_suffix:
        description: 'Prerelease suffix, e.g. alpha.5. Blank = alpha.<run_number>.'
        required: false
        default: ''

permissions:
  contents: read
  id-token: write   # required for Trusted Publishing: lets the job request a GitHub OIDC token

concurrency:
  # Never run two publishes at once; a second run could try to push a version the
  # first is still validating.
  group: publish-nuget
  cancel-in-progress: false

jobs:
  publish:
    name: Pack + push to NuGet.org
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            10.0.x

      - name: Compute version suffix
        id: ver
        run: |
          SUFFIX="${{ github.event.inputs.version_suffix }}"
          if [ -z "$SUFFIX" ]; then SUFFIX="alpha.${{ github.run_number }}"; fi
          echo "suffix=$SUFFIX" >> "$GITHUB_OUTPUT"
          echo "Publishing version: 1.0.0-$SUFFIX"

      - name: Pack libraries + meta-package
        env:
          DOTNET_NOLOGO: '1'
          DOTNET_CLI_TELEMETRY_OPTOUT: '1'
        run: |
          dotnet pack HartsyInference.sln \
            -c Release -o artifacts \
            -p:VersionSuffix=${{ steps.ver.outputs.suffix }}
          dotnet pack src/HartsyInference.Meta/HartsyInference.Meta.csproj \
            -c Release -o artifacts \
            -p:VersionSuffix=${{ steps.ver.outputs.suffix }}

      - name: List packages
        run: ls -1 artifacts/*.nupkg

      # Refuse to publish a partial release. The meta-package 'HartsyInference' pins its dependencies to
      # the EXACT same version of every sub-package, so if a pack/push drops even one sub-package, the
      # meta resolves to a version whose deps don't exist on the feed and every consumer restore breaks
      # with NU1102. Verify the full set is present BEFORE pushing so a partial pack can never ship.
      - name: Verify complete package set
        run: |
          VER="1.0.0-${{ steps.ver.outputs.suffix }}"
          EXPECTED="HartsyInference HartsyInference.Core HartsyInference.Cpu HartsyInference.Cuda HartsyInference.Vulkan HartsyInference.ModelHandler HartsyInference.Tokenizers HartsyInference.Diffusion HartsyInference.Audio HartsyInference.Vision HartsyInference.Video HartsyInference.Interactive HartsyInference.ThreeD"
          missing=0
          for pkg in $EXPECTED; do
            if [ ! -f "artifacts/${pkg}.${VER}.nupkg" ]; then
              echo "MISSING: artifacts/${pkg}.${VER}.nupkg"
              missing=1
            fi
          done
          if [ "$missing" = "1" ]; then
            echo "::error::Incomplete package set for ${VER} — refusing to publish a partial release (would brick consumer restores via the meta-package)."
            exit 1
          fi
          echo "All 13 packages present for ${VER}."

      # Exchange the GitHub OIDC token for a short-lived (1-hour) NuGet API key.
      # Run this right before the push so the key doesn't expire mid-job.
      - name: NuGet login (OIDC -> temporary API key)
        uses: NuGet/login@v1
        id: login
        with:
          user: kalebbroo   # nuget.org profile name (the policy owner), NOT an email

      - name: Push to NuGet.org
        run: |
          dotnet nuget push "artifacts/*.nupkg" \
            --api-key "${{ steps.login.outputs.NUGET_API_KEY }}" \
            --source https://api.nuget.org/v3/index.json \
            --skip-duplicate
