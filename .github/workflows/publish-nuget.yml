name: Publish to NuGet

# Auto-publishes the HartsyInference packages to NuGet.org on every push to main that
# touches source or packaging. The version is <VersionPrefix>-<VersionSuffix>, both read from
# Directory.Build.props (the single source of truth) — bump <VersionSuffix> there before
# each release (bump <VersionPrefix> too for a real semver major/minor) and pin the SAME
# version in the SwarmUI extension csproj so all three match.
# NuGet.org forbids re-pushing an existing version, but the push step uses --skip-duplicate,
# so pushing without bumping is a harmless no-op. Trigger manually via "Run workflow" to
# override the suffix for a one-off.
#
# Auth uses NuGet Trusted Publishing (OIDC), so there is no API key/secret to store. A matching
# Trusted Publisher policy must exist on nuget.org:
#   Owner=kalebbroo  RepositoryOwner=HartsyAI  Repository=HartsyInference  WorkflowFile=publish-nuget.yml

on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'Directory.Build.props'
      - 'Directory.Build.targets'
      - 'Directory.Packages.props'
      - '.github/workflows/publish-nuget.yml'
  workflow_dispatch:
    inputs:
      version_suffix:
        description: 'Prerelease suffix, e.g. alpha.5. Blank = Directory.Build.props VersionSuffix.'
        required: false
        default: ''

permissions:
  contents: read
  id-token: write   # required for Trusted Publishing: lets the job request a GitHub OIDC token

concurrency:
  # Never run two publishes at once; a second run could try to push a version the
  # first is still validating.
  group: publish-nuget
  cancel-in-progress: false

jobs:
  publish:
    name: Pack + push to NuGet.org
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            10.0.x

      - name: Compute version
        id: ver
        run: |
          SUFFIX="${{ github.event.inputs.version_suffix }}"
          # Single source of truth = <VersionSuffix> in Directory.Build.props. A manual "Run workflow"
          # with a version_suffix input still overrides it. (We no longer use github.run_number, so the
          # published version always matches the props file and the extension's pinned version.)
          if [ -z "$SUFFIX" ]; then
            SUFFIX=$(sed -n 's:.*<VersionSuffix>\(.*\)</VersionSuffix>.*:\1:p' Directory.Build.props | head -1)
          fi
          if [ -z "$SUFFIX" ]; then
            echo "::error::Could not read <VersionSuffix> from Directory.Build.props."
            exit 1
          fi
          # <VersionPrefix> is NOT overridable via workflow_dispatch -- it's a real semver major/minor, not a
          # per-release knob like the suffix, so it always comes from the props file.
          PREFIX=$(sed -n 's:.*<VersionPrefix>\(.*\)</VersionPrefix>.*:\1:p' Directory.Build.props | head -1)
          if [ -z "$PREFIX" ]; then
            echo "::error::Could not read <VersionPrefix> from Directory.Build.props."
            exit 1
          fi
          echo "suffix=$SUFFIX" >> "$GITHUB_OUTPUT"
          echo "version=$PREFIX-$SUFFIX" >> "$GITHUB_OUTPUT"
          echo "Publishing version: $PREFIX-$SUFFIX"

      - name: Pack libraries
        env:
          DOTNET_NOLOGO: '1'
          DOTNET_CLI_TELEMETRY_OPTOUT: '1'
        run: |
          dotnet pack HartsyInference.sln \
            -c Release -o artifacts \
            -p:VersionSuffix=${{ steps.ver.outputs.suffix }}

      - name: List packages
        run: ls -1 artifacts/*.nupkg

      # Refuse to publish a partial release. A partial pack (e.g. one project fails to restore/build)
      # would silently push a subset of packages, leaving consumers who pin exact versions with
      # missing packages on the feed. Verify the full set is present BEFORE pushing.
      - name: Verify complete package set
        run: |
          VER="${{ steps.ver.outputs.version }}"
          # Tokenizers folded into ModelAssets and Phonemizer into Audio, so neither ships as its own package.
          # API and Cli are IsPackable=false. Engine is the service layer consumers actually depend on.
          EXPECTED="HartsyInference HartsyInference.Core HartsyInference.Cpu HartsyInference.Cuda HartsyInference.Vulkan HartsyInference.ModelAssets HartsyInference.Diffusion HartsyInference.Audio HartsyInference.Vision HartsyInference.Video HartsyInference.World HartsyInference.ThreeD HartsyInference.LLM HartsyInference.Engine"
          missing=0
          for pkg in $EXPECTED; do
            if [ ! -f "artifacts/${pkg}.${VER}.nupkg" ]; then
              echo "MISSING: artifacts/${pkg}.${VER}.nupkg"
              missing=1
            fi
          done
          if [ "$missing" = "1" ]; then
            echo "::error::Incomplete package set for ${VER} — refusing to publish a partial release."
            exit 1
          fi
          echo "All required packages present for ${VER}."

      - name: Verify CUDA sparse-attention PTX package contents
        run: |
          set -euo pipefail
          VER="${{ steps.ver.outputs.version }}"
          CUDA_PACKAGE="artifacts/HartsyInference.Cuda.${VER}.nupkg"
          if ! unzip -t "$CUDA_PACKAGE" 'ptx/h3_vsa.ptx' >/dev/null; then
            echo "::error::${CUDA_PACKAGE} does not contain a valid ptx/h3_vsa.ptx."
            exit 1
          fi
          echo "Verified valid ptx/h3_vsa.ptx in ${CUDA_PACKAGE}."

      # The PTX can be present in the CUDA nupkg yet still fail to reach a downstream application. Exercise both
      # supported consumer roots: the meta-package and the Engine package pinned by the SwarmUI extension.
      - name: Verify PTX in clean consumer output
        run: |
          set -euo pipefail
          VER="${{ steps.ver.outputs.version }}"
          CONSUMER_ROOT=$(mktemp -d)
          trap 'rm -rf "$CONSUMER_ROOT"' EXIT
          CUDA_PACKAGE="$GITHUB_WORKSPACE/artifacts/HartsyInference.Cuda.${VER}.nupkg"
          for ROOT_PACKAGE in HartsyInference HartsyInference.Engine; do
            ROOT_LOWER=$(printf '%s' "$ROOT_PACKAGE" | tr '[:upper:]' '[:lower:]')
            CONSUMER_DIR="$CONSUMER_ROOT/$ROOT_LOWER"
            CONSUMER_PACKAGES="$CONSUMER_DIR/packages"
            # --name is load-bearing: without it the project is named after its directory, so the
            # HartsyInference consumer becomes hartsyinference.csproj and referencing HartsyInference is a
            # self-reference (NU1108 "Cycle detected"). The pre-loop version escaped this only because
            # mktemp -d gave the directory a random name.
            dotnet new console --framework net10.0 --output "$CONSUMER_DIR" --name ptxconsumer --no-restore
            CONSUMER_PROJECT=$(find "$CONSUMER_DIR" -maxdepth 1 -name '*.csproj' -print -quit)
            dotnet add "$CONSUMER_PROJECT" package "$ROOT_PACKAGE" --version "$VER" --no-restore
            NUGET_PACKAGES="$CONSUMER_PACKAGES" dotnet restore "$CONSUMER_PROJECT" \
              --source "$GITHUB_WORKSPACE/artifacts" \
              --source https://api.nuget.org/v3/index.json \
              --no-cache \
              --force-evaluate
            CACHED_ROOT=$(find "$CONSUMER_PACKAGES/$ROOT_LOWER" -name "${ROOT_LOWER}.*.nupkg" -print -quit)
            CACHED_CUDA=$(find "$CONSUMER_PACKAGES/hartsyinference.cuda" -name 'hartsyinference.cuda.*.nupkg' -print -quit)
            if ! cmp -s "$GITHUB_WORKSPACE/artifacts/${ROOT_PACKAGE}.${VER}.nupkg" "$CACHED_ROOT" || \
               ! cmp -s "$CUDA_PACKAGE" "$CACHED_CUDA"; then
              echo "::error::Clean ${ROOT_PACKAGE} consumer did not restore the just-packed root/CUDA packages."
              exit 1
            fi
            NUGET_PACKAGES="$CONSUMER_PACKAGES" dotnet build "$CONSUMER_PROJECT" -c Release --no-restore
            PTX="$CONSUMER_DIR/bin/Release/net10.0/Ptx/h3_vsa.ptx"
            if [ ! -s "$PTX" ]; then
              echo "::error::Clean ${ROOT_PACKAGE} consumer output is missing Ptx/h3_vsa.ptx."
              exit 1
            fi
            PACKED_PTX="$CONSUMER_DIR/h3_vsa.packed.ptx"
            unzip -p "$CUDA_PACKAGE" 'ptx/h3_vsa.ptx' > "$PACKED_PTX"
            if ! cmp -s "$PACKED_PTX" "$PTX"; then
              echo "::error::${ROOT_PACKAGE} consumer PTX differs from ${CUDA_PACKAGE}."
              exit 1
            fi
            echo "Verified ${PTX} from ${ROOT_PACKAGE} is byte-identical to the packaged PTX."
          done

      # Exchange the GitHub OIDC token for a short-lived (1-hour) NuGet API key.
      # Run this right before the push so the key doesn't expire mid-job.
      - name: NuGet login (OIDC -> temporary API key)
        uses: NuGet/login@v1
        id: login
        with:
          user: kalebbroo   # nuget.org profile name (the policy owner), NOT an email

      - name: Push to NuGet.org
        run: |
          dotnet nuget push "artifacts/*.nupkg" \
            --api-key "${{ steps.login.outputs.NUGET_API_KEY }}" \
            --source https://api.nuget.org/v3/index.json \
            --skip-duplicate
