name: Publish benchmark explorer
on:
  push:
    branches: [main]
    paths: ['benchmarks/submissions/**', 'benchmarks/HartsyInference.BenchmarkRunner/**', 'benchmarks/automation/**', '.github/workflows/benchmark-publish.yml']
  workflow_dispatch:
  schedule:
    - cron: '17 6 * * 1'
permissions:
  contents: read
  pull-requests: read
  pages: write
  id-token: write
concurrency:
  group: benchmark-pages
  cancel-in-progress: false
jobs:
  publish:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - run: dotnet build benchmarks/HartsyInference.BenchmarkRunner -c Release
      - name: Revalidate mirrored archives and merged-head receipts
        env:
          GH_TOKEN: ${{ github.token }}
        run: node benchmarks/automation/control.mjs publish
      - uses: actions/upload-pages-artifact@v3
        with:
          path: benchmarks/generated
      - uses: actions/deploy-pages@v4
        id: deployment
