name: Claude Code

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]

jobs:
  claude:
    if: contains(github.event.comment.body, '@claude')
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      issues: write
      id-token: write
      actions: read
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 1

      # issue_comment events run on the default branch, so the workspace holds main, not the pull request. The action hashes every changed file of
      # the pull request in that workspace and aborts when a file the PR adds does not exist ("git hash-object ... No such file or directory"),
      # which made every review of a PR that adds files fail after about a second. Check out the PR head first.
      - name: Check out the pull request head
        if: github.event.issue.pull_request || github.event.pull_request
        env:
          PR_NUMBER: ${{ github.event.issue.number || github.event.pull_request.number }}
        run: |
          git fetch --depth=1 origin "pull/${PR_NUMBER}/head"
          git checkout --force FETCH_HEAD

      - uses: anthropics/claude-code-action@v1
        with:
          # Uses your Claude subscription instead of API billing.
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          claude_args: "--model claude-opus-5-5"

