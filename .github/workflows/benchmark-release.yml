name: Release benchmark runner
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    if: github.ref == 'refs/heads/main'
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            rid: linux-x64
          - os: windows-latest
            rid: win-x64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - run: dotnet test tests/HartsyInference.BenchmarkRunner.Tests -c Release
      - run: dotnet publish benchmarks/HartsyInference.BenchmarkRunner -c Release -r ${{ matrix.rid }} --self-contained true -p:BenchmarkRevision=${{ github.sha }} -o artifacts/runner
      - if: runner.os == 'Linux'
        run: tar -czf artifacts/hartsy-bench-linux-x64.tar.gz -C artifacts/runner .
      - if: runner.os == 'Windows'
        shell: pwsh
        run: Compress-Archive -Path artifacts/runner/* -DestinationPath artifacts/hartsy-bench-win-x64.zip
      - uses: actions/upload-artifact@v4
        with:
          name: bundle-${{ matrix.rid }}
          path: |
            artifacts/*.tar.gz
            artifacts/*.zip
  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: bundle-*
          path: bundles
          merge-multiple: true
      - name: Publish immutable standalone runner bundles
        working-directory: bundles
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          REVISION: ${{ github.sha }}
        run: |
          sha256sum hartsy-bench-* > SHA256SUMS
          gh release create "benchmark-runner-$REVISION" * --target "$REVISION" --title "Benchmark runner $REVISION" --notes "Self-contained Linux and Windows runners for this exact engine commit. Model weights are downloaded separately by the fetch command."
