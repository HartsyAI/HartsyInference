name: CI (GPU)

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'src/SharpInference.Cuda/**'
      - 'src/SharpInference.Diffusion/**'
      - 'tests/SharpInference.Cuda.Tests/**'
      - 'tests/SharpInference.Diffusion.Tests/**'
      - '.github/workflows/ci-gpu.yml'

permissions:
  contents: read

# Required runner labels: self-hosted runner with `cuda` label installed by the
# project owner. The runner box must have:
#  - .NET 10 SDK
#  - CUDA 12+ toolkit (libcuda.so / cuda.dll on PATH)
#  - PTX kernels built once via `bash native/cuda/build.sh` (output goes to
#    `native/cuda/build/`; persisted on the runner so this workflow doesn't
#    rebuild them every push).
#  - Optional: SHARPINFERENCE_MODELS_DIR environment variable pointing at a
#    cached models directory. Tests skip cleanly when individual checkpoints
#    are missing.

jobs:
  fast-lane:
    name: GPU smoke + numerical diffs (≤ 5 min)
    runs-on: [self-hosted, cuda]
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - name: Restore + build (Release)
        run: |
          dotnet restore
          dotnet build --configuration Release --no-restore

      - name: Quick GPU smoke (no checkpoints required)
        run: |
          dotnet test tests/SharpInference.Cuda.Tests/SharpInference.Cuda.Tests.csproj \
            --configuration Release --no-build \
            --logger "console;verbosity=normal"

      - name: Diff tests (skip cleanly when no checkpoint)
        env:
          # Models dir comes from runner-local config — never hard-coded in YAML
          SHARPINFERENCE_MODELS_DIR: ${{ vars.SHARPINFERENCE_MODELS_DIR }}
        run: |
          dotnet test tests/SharpInference.Diffusion.Tests/SharpInference.Diffusion.Tests.csproj \
            --configuration Release --no-build \
            --filter "FullyQualifiedName~Diff|FullyQualifiedName~Ssim|FullyQualifiedName~Smoke" \
            --logger "console;verbosity=normal"

  slow-lane:
    name: GPU end-to-end generation (manual)
    runs-on: [self-hosted, cuda]
    if: github.event_name == 'workflow_dispatch'
    timeout-minutes: 120
    needs: fast-lane

    steps:
      - uses: actions/checkout@v4

      - name: Build (Release)
        run: |
          dotnet restore
          dotnet build --configuration Release --no-restore

      - name: End-to-end generation tests
        env:
          SHARPINFERENCE_MODELS_DIR: ${{ vars.SHARPINFERENCE_MODELS_DIR }}
        run: |
          dotnet test tests/SharpInference.Diffusion.Tests/SharpInference.Diffusion.Tests.csproj \
            --configuration Release --no-build \
            --filter "FullyQualifiedName~Generation" \
            --logger "console;verbosity=normal"
